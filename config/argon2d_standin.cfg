# ============================================================================
# plasma-0d v0.2.0  --  2D STAND-IN CASE (Cartesian slab, x-y)
#
# EVERY NUMBER IN THIS FILE IS A PLACEHOLDER. They exist so the 2D code runs end
# to end and can be verified against known answers. They are NOT the lab's plasma,
# NOT a model of the CNT beam plume, and must not be quoted as such.
# The pressure, mobilities and beam numbers were picked so the run is numerically
# comfortable (reaches steady state in a few thousand steps), not to be physical.
#
# Reaction and species syntax is the same as argon_standin.cfg (v0.1.0).
# Units: densities m^-3, Te in eV, rate constants m^3/s, pressure Pa, lengths m, time s.
# ============================================================================

[global]
pressure_Pa    = 100          # PLACEHOLDER (not the lab's pressure)
gas_temp_K     = 300
Te0_eV         = 1.0          # held CONSTANT in v0.2.0 (the electron energy equation is not built yet)
t_end_s        = 5.0e-3
n_outputs      = 100          # history rows

[species]
Ar   : charge=0  mass=39.948 fixed=1
Ar+  : charge=1  mass=39.948 n0=1.0e12
Ar*  : charge=0  mass=39.948 n0=1.0e10

[reactions]
ionization    : e + Ar   => Ar+ + 2 e ; A=2.34e-14 B=0.59 E=17.44 dE=15.76
excitation    : e + Ar   => Ar* + e   ; A=2.48e-14 B=0.33 E=12.78 dE=11.56
step_ioniz    : e + Ar*  => Ar+ + 2 e ; A=6.8e-15  B=0.67 E=4.78  dE=4.20
quench        : e + Ar*  => Ar + e    ; A=2.0e-16  B=0.0  E=0.0   dE=-11.56

# Neutral wall transport. Dp in m^2 Pa / s (PLACEHOLDER). Charged species are
# absorbed at the walls by the transport itself, so they need no line here.
[walls]
Ar*  : diffusion Dp=0.024

[grid]
nx = 40
ny = 40
Lx_m = 0.02
Ly_m = 0.02
# Side types: 0 = wall (absorbing, grounded), 1 = symmetry (mirror, no flux)
bc_xmin = 0
bc_xmax = 0
bc_ymin = 0
bc_ymax = 0

[transport]
# PLACEHOLDER mobilities, in m^2 / (V s). D = mu * (temperature in volts).
mu_e_m2Vs = 40
mu_i_m2Vs = 0.16

[beam]
# PLACEHOLDER prescribed source: electron-ion pair production, Gaussian across x,
# exponential decay with depth y from the y = 0 wall. Not a deposition-profile result.
S0_m3s       = 1.0e20
x_center_m   = 0.01
sigma_x_m    = 0.002
depth_y_m    = 0.005
excite_ratio = 0.5            # metastables made per pair (placeholder)

[solver2d]
dt_s = 1.0e-6
