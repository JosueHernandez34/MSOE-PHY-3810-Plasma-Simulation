# ============================================================================
# plasma-0d  --  STAND-IN ARGON CASE
#
# EVERY NUMBER IN THIS FILE IS A PLACEHOLDER. They are textbook-order-of-
# magnitude values for a generic low-pressure argon discharge (Lieberman &
# Lichtenberg style rate fits) so the code runs end to end. They are NOT
# the lab's plasma and must not be quoted as such. Replace the [global]
# values and the rate constants with Dr. Masoud's real ones.
#
# Units: densities m^-3, Te in eV, rate constants m^3/s (two-body),
#        energies in eV, lengths in m, pressure in Pa, power in W.
# Rate constant form:  k(Te) = A * Te^B * exp(-E / Te)
# ============================================================================

[global]
# PLACEHOLDER discharge conditions
pressure_Pa    = 1.333        # about 10 mTorr
gas_temp_K     = 300
power_W        = 100          # power absorbed by the plasma, not generator power
radius_m       = 0.10         # cylinder radius
length_m       = 0.20         # cylinder length
ion_cross_section_m2 = 1.0e-18  # ion-neutral cross section, sets ion mean free path

# Initial state. A non-zero seed is needed or the avalanche never starts.
Te0_eV         = 2.0

# Integrator
t_end_s        = 0.5          # long enough to reach steady state (metastable wall diffusion time ~ 0.07 s)
t_first_s      = 1.0e-9       # first output time after t = 0 (outputs are log-spaced)
n_outputs      = 200
rtol           = 1.0e-5
atol_density   = 1.0e6        # m^-3, floor so empty species do not force tiny steps
atol_Te        = 1.0e-7       # eV
h_initial_s    = 1.0e-12
h_max_s        = 1.0e-3

# ----------------------------------------------------------------------------
# Species. charge in units of e. mass in amu. fixed=1 means the density is set
# from pressure and gas temperature instead of being integrated (neutral
# background, assumed undepleted). n0 is the initial density for evolved species.
# Electrons are NOT listed: n_e follows from charge neutrality.
# To add a species: add a line here, then add its reactions below.
# ----------------------------------------------------------------------------
[species]
Ar   : charge=0  mass=39.948 fixed=1
Ar+  : charge=1  mass=39.948 n0=1.0e15
Ar*  : charge=0  mass=39.948 n0=1.0e10

# ----------------------------------------------------------------------------
# Reactions: name : reactants => products ; rate parameters
#   dE    = energy removed from the electron gas per event, eV (negative = gain)
#   dEte  = extra loss proportional to Te per event (used for elastic: 3 me/M)
# "e" is the electron. Electron density is derived, so e in the products is
# written for readability only; it does not change the bookkeeping.
# ----------------------------------------------------------------------------
[reactions]
ionization    : e + Ar   => Ar+ + 2 e ; A=2.34e-14 B=0.59 E=17.44 dE=15.76
excitation    : e + Ar   => Ar* + e   ; A=2.48e-14 B=0.33 E=12.78 dE=11.56
step_ioniz    : e + Ar*  => Ar+ + 2 e ; A=6.8e-15  B=0.67 E=4.78  dE=4.20
quench        : e + Ar*  => Ar + e    ; A=2.0e-16  B=0.0  E=0.0   dE=-11.56
elastic       : e + Ar   => Ar + e    ; A=2.3e-14  B=1.55 E=0.0   dE=0.0 dEte=4.12e-5

# ----------------------------------------------------------------------------
# Wall losses.
#   bohm      : positive ion flux to the wall at the Bohm speed over the
#               effective area (h_L, h_R edge-to-center factors). Carries the
#               electron out with it and takes the sheath energy (2 Te + Vs).
#   diffusion : neutral diffusion to the wall, D = Dp / pressure.
#               Dp in m^2 Pa / s. PLACEHOLDER value.
# ----------------------------------------------------------------------------
[walls]
Ar+  : bohm
Ar*  : diffusion Dp=0.024
